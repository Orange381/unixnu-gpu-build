name: Data seed

# The writable Data volume's seed for the payload (unixnu build payload
# --data-ramdisk), built on a hosted macOS runner because every step needs
# hdiutil and diskutil apfs.
#
# A hosted runner cannot create a 100 GiB raw image (`hdiutil create -type
# UDTO`), and `hdiutil resize` refuses a UDTO image (exit 22), so the container
# is made directly on a sparse file instead:
#
#   1. truncate a raw image file to the requested size -- APFS keeps that sparse,
#      so the runner's disk usage is only what gets written
#   2. hdiutil attach it as a CRawDiskImage and `diskutil apfs create` a
#      container + OwnerData volume filling the whole device
#   3. copy the OS volume's private/var in, add the directories userland expects
#   4. detach and pack with DarwinBoot's DBRDISK1 writer -- only non-zero pages
#      travel, so the artifact stays small while the volume the kernel presents
#      is the full size asked for
#
# The seed is rebuilt from scratch on every run, so the Data volume UUID changes
# with it; the report prints the UUID that this run produced.

on:
  workflow_dispatch:
    inputs:
      size_mib:
        description: Data container size in MiB (the volume the kernel presents)
        required: true
        default: "102400"

permissions:
  contents: read

env:
  # The whole restore image and the OS member, both pinned. The member pin is
  # also in os-profiles/ios-16.5-20F66/profile.toml [ipsw.sha256] and the build
  # checks it, so a mismatch here stops before anything is mounted.
  IPSW_SHA256: c1091c401f67e3aa7cdfeb2cc19e6c79be3c957aae4e097a019e9ccea07d52f2
  OS_MEMBER: 096-04088-077.dmg
  IPSW_URL: https://updates.cdn-apple.com/2023SpringFCS/fullrestores/032-85130/6AB0D10A-8AF9-4F6C-8CF5-A1B315CABE88/iPhone10,3,iPhone10,6_16.5_20F66_Restore.ipsw
  SIZE_MIB: ${{ inputs.size_mib || '102400' }}

jobs:
  seed:
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          repository: xwsjjctz/UniXNU-NX769J
          path: device
          persist-credentials: false

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: unixnu
          persist-credentials: false

      - name: Drop the runner's GitHub credential rewriting
        run: |
          git config --global --unset-all url.https://github.com/.insteadOf || true
          git config --global --unset-all http.https://github.com/.extraheader || true

      # Only DarwinBoot is needed, and it is a submodule rather than part of the
      # tree. Its Test/packed_ramdisk.py is the DBRDISK1 writer the seed packs
      # with; the rest of the submodules are not worth fetching.
      - name: Fetch the DarwinBoot submodule
        run: |
          set -euo pipefail
          git -C unixnu submodule update --init --depth 1 drivers/DarwinBoot

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch the iOS 16.5 restore image
        run: |
          set -euo pipefail
          trap 'echo "::error title=Fetch the restore image::$BASH_COMMAND"' ERR
          {
            echo '## Data seed'
            echo '### Runner disk before'
            echo '```'
            df -h "$RUNNER_TEMP"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/ipsw"
          curl -fSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/ipsw/restore.ipsw" "$IPSW_URL"
          echo "$IPSW_SHA256  $RUNNER_TEMP/ipsw/restore.ipsw" | shasum -a 256 -c -

      - name: Extract the OS volume
        run: |
          set -euo pipefail
          trap 'echo "::error title=Extract the OS volume::$BASH_COMMAND"' ERR
          python3 - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          ipsw = Path(os.environ['RUNNER_TEMP']) / 'ipsw/restore.ipsw'
          out = Path(os.environ['RUNNER_TEMP']) / 'os'
          out.mkdir(parents=True, exist_ok=True)
          member = os.environ['OS_MEMBER']
          import tomllib
          pin = tomllib.loads(Path('device/os-profiles/ios-16.5-20F66/profile.toml')
                              .read_text(encoding='utf-8'))['ipsw']['sha256'][member]
          with zipfile.ZipFile(ipsw) as archive, archive.open(member) as source:
              digest = hashlib.sha256()
              with (out / member).open('wb') as target:
                  while chunk := source.read(8 * 1024 * 1024):
                      target.write(chunk)
                      digest.update(chunk)
          if digest.hexdigest() != pin:
              raise SystemExit(f'{member} hashes to {digest.hexdigest()}, the profile pins {pin}')
          print(f'{member} {digest.hexdigest()} extracted')
          PY
          rm -f "$RUNNER_TEMP/ipsw/restore.ipsw"

      - name: Mount the OS volume read-only
        run: |
          set -euo pipefail
          trap 'echo "::error title=Mount the OS volume::$BASH_COMMAND"' ERR
          mkdir -p "$RUNNER_TEMP/os-mount"
          hdiutil attach -readonly -nobrowse -owners off \
            -mountpoint "$RUNNER_TEMP/os-mount" "$RUNNER_TEMP/os/$OS_MEMBER"

      - name: Build the seed on a sparse image at the requested size
        id: seed
        run: |
          set -euo pipefail
          trap 'echo "::error title=Build the seed::$BASH_COMMAND"' ERR
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/seed-work"
          raw="$RUNNER_TEMP/seed-work/owner-data.cdr"
          # 1. sparse raw image of the final size
          python3 - "$raw" "$SIZE_MIB" <<'PY'
          import sys
          from pathlib import Path
          image, mib = Path(sys.argv[1]), int(sys.argv[2])
          with image.open('wb') as stream:
              stream.truncate(mib * 1024 * 1024)
          print(f'raw image {image} truncated to {mib} MiB')
          PY
          # 2. attach as a raw disk image and make the container fill the device
          hdiutil attach -nobrowse -owners off -plist \
            -imagekey diskimage-class=CRawDiskImage "$raw" > "$RUNNER_TEMP/attach.plist"
          device=$(python3 -c "import plistlib,sys;print(plistlib.load(open(sys.argv[1],'rb'))['system-entities'][0]['dev-entry'])" "$RUNNER_TEMP/attach.plist")
          echo "attached $device"
          diskutil apfs create "$device" OwnerData
          volume=$(python3 -c "import plistlib,sys;print(plistlib.load(open(sys.argv[1],'rb'))['system-entities'][-1]['dev-entry'])" "$RUNNER_TEMP/attach.plist")
          # 3. mount it and copy the OS volume's private/var in
          mount="$RUNNER_TEMP/seed-work/mount"
          mkdir -p "$mount"
          diskutil mount -mountPoint "$mount" "$volume"
          rsync -a --exclude 'staged_system_apps' \
            "$RUNNER_TEMP/os-mount/private/var/" "$mount/"
          mkdir -p "$mount/keybags" "$mount/mobile/tmp" "$mount/tmp" "$mount/run"
          chmod 1777 "$mount/tmp"
          # 4. record what it made, then detach
          diskutil info -plist "$volume" > "$RUNNER_TEMP/volume.plist"
          python3 - "$RUNNER_TEMP/volume.plist" "$RUNNER_TEMP/out/volume.json" <<'PY'
          import json, plistlib, sys
          info = plistlib.load(open(sys.argv[1], 'rb'))
          json.dump({'volume_uuid': info.get('VolumeUUID'), 'size': info.get('Size'),
                     'free': info.get('FreeSpace', 0)},
                    open(sys.argv[2], 'w'), indent=2)
          print('volume', info.get('VolumeUUID'), info.get('Size'), 'free', info.get('FreeSpace', 0))
          PY
          df -h "$RUNNER_TEMP" >> "$GITHUB_STEP_SUMMARY"
          hdiutil detach "$device" -force

      - name: Pack the seed
        run: |
          set -euo pipefail
          trap 'echo "::error title=Pack the seed::$BASH_COMMAND"' ERR
          python3 - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          sys.path.insert(0, str(Path('unixnu/drivers/DarwinBoot/Test').resolve()))
          import packed_ramdisk
          image = temp / 'seed-work/owner-data.cdr'
          output = temp / 'out/nx769j-data.dbr'
          header = image.open('rb').read(4096)
          assert header[32:36] == b'NXSB', 'not an APFS container'
          block = int.from_bytes(header[36:40], 'little')
          blocks = int.from_bytes(header[40:48], 'little')
          packed_ramdisk.pack(image, output)
          volume = json.loads((temp / 'out/volume.json').read_text())
          report = {
              'os_launchd_sha256': hashlib.sha256(
                  Path(os.environ['RUNNER_TEMP'], 'os-mount/sbin/launchd').read_bytes()).hexdigest(),
              'volume_uuid': volume['volume_uuid'],
              'size_mib': int(os.environ['SIZE_MIB']),
              'container_bytes': block * blocks,
              'output': str(output),
              'output_sha256': hashlib.sha256(output.read_bytes()).hexdigest(),
              'output_bytes': output.stat().st_size,
              'hardware_tested': False,
          }
          Path(str(output) + '.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY
          {
            echo '### Seed'
            echo '```'
            cat "$RUNNER_TEMP/out/nx769j-data.dbr.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unmount the OS volume
        if: always()
        run: hdiutil detach "$RUNNER_TEMP/os-mount" -force || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: nx769j-data-seed
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 7
