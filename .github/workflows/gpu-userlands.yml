# Build the NX769J GPU user space (Turnip + NativeAdrenoMetal.bundle + vktest)
# on a GitHub-hosted macOS runner, so no local Mac is needed.
name: gpu-userlands

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  userlands:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      ADRENOMETAL_PIN: c6d29caad6d880cc8204ebe3bc34d77479a3255d
      ADRENOPM4_PIN: 445f8fe6d115738352b9d78dc70af6d61aa7f62f
      GOPFRAMEBUFFER_PIN: 8666a9950c9699b368931d18cac92c0fdb2ce9c0
      METAL2VULKAN_PIN: 720ef1ce9ae2a2068999a8675717418b9416283e
      MESA_PIN: 85fda3b36405bcaea8bffc64aa4f2651dc90770d
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Show the run environment
        run: |
          echo "runner: $RUNNER_OS $RUNNER_ARCH"
          sw_vers
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-path || true
          echo "pins: $ADRENOMETAL_PIN $ADRENOPM4_PIN $GOPFRAMEBUFFER_PIN $METAL2VULKAN_PIN $MESA_PIN"

      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          repository: xwsjjctz/UniXNU-NX769J
          ref: main
          path: device
          persist-credentials: false

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: unixnu
          persist-credentials: false

      - name: Drop the runner's GitHub credential rewriting
        run: |
          set -uxo pipefail
          git config --global --unset-all url.https://github.com/.insteadOf || true
          git config --global --unset-all url.https://github.com/.insteadof || true
          git config --global --unset-all http.https://github.com/.extraheader || true
          git config --global --get-regexp '^url\.|^http\.' || true

      - name: Fetch Mesa at its pinned revision
        run: |
          set -euxo pipefail
          M=$PWD/unixnu/.cache/mesa-work
          rm -rf "$M"
          git init "$M"
          git -C "$M" remote add origin https://gitlab.freedesktop.org/mesa/mesa.git
          git -C "$M" fetch --depth 1 origin "$MESA_PIN"
          git -C "$M" checkout --detach FETCH_HEAD
          test "$(git -C "$M" rev-parse HEAD)" = "$MESA_PIN"

      - name: Apply the recorded Mesa patches
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          U = Path('unixnu').resolve()
          pins = json.loads((U / 'scripts/data/adreno-compiler-inputs.json').read_text())
          M = U / '.cache/mesa-work'
          for patch in pins['patches']:
              subprocess.run(['git', '-C', str(M), 'apply', '--whitespace=nowarn', str(U / patch)], check=True)
          print('applied %d Mesa patches' % len(pins['patches']))
          PY
          git -C unixnu/.cache/mesa-work status --porcelain | head -40

      - name: Fetch metal2vulkan at its pinned revision
        run: |
          set -euxo pipefail
          M=$PWD/device/.cache/gpu-user/metal2vulkan
          rm -rf "$M"
          git init "$M"
          git -C "$M" remote add origin https://github.com/steelbrain/metal2vulkan
          git -C "$M" fetch --depth 1 origin "$METAL2VULKAN_PIN"
          git -C "$M" checkout --detach FETCH_HEAD

      - name: Fetch and pin the submodules
        run: |
          set -euxo pipefail
          for path in drivers/AdrenoMetal drivers/Adreno740 kits/AdrenoPM4 drivers/GopFramebuffer; do
            git -C unixnu submodule update --init --depth 1 "$path" || git -C unixnu submodule update --init "$path"
          done
          git -C unixnu/drivers/AdrenoMetal fetch --depth 1 origin "$ADRENOMETAL_PIN" || true
          git -C unixnu/drivers/AdrenoMetal checkout --detach "$ADRENOMETAL_PIN"
          git -C unixnu/kits/AdrenoPM4 fetch --depth 1 origin "$ADRENOPM4_PIN" || true
          git -C unixnu/kits/AdrenoPM4 checkout --detach "$ADRENOPM4_PIN"
          git -C unixnu/drivers/GopFramebuffer fetch --depth 1 origin "$GOPFRAMEBUFFER_PIN" || true
          git -C unixnu/drivers/GopFramebuffer checkout --detach "$GOPFRAMEBUFFER_PIN"
          git -C unixnu/drivers/AdrenoMetal rev-parse HEAD
          git -C unixnu/kits/AdrenoPM4 rev-parse HEAD
          git -C unixnu/drivers/GopFramebuffer rev-parse HEAD

      - name: Stage the .cache/gpu-user inputs
        run: |
          set -euxo pipefail
          C=$PWD/device/.cache/gpu-user
          mkdir -p "$C/nativemetal" "$C/AdrenoPM4" "$C/NativeMobileDisplay"
          git -C unixnu/drivers/AdrenoMetal archive "$ADRENOMETAL_PIN" | tar -x -C "$C/nativemetal"
          git -C unixnu/kits/AdrenoPM4 archive "$ADRENOPM4_PIN" | tar -x -C "$C/AdrenoPM4"
          cp unixnu/drivers/GopFramebuffer/NativeGOPWire.h "$C/NativeMobileDisplay/NativeGOPWire.h"
          ls -l "$C"

      - name: Install the build tools
        run: |
          set -euxo pipefail
          brew install bison glslang shaderc spirv-tools llvm || brew upgrade bison glslang shaderc spirv-tools llvm || true
          python3 -m venv unixnu/.cache/mesa-venv
          unixnu/.cache/mesa-venv/bin/pip install --upgrade pip
          unixnu/.cache/mesa-venv/bin/pip install packaging setuptools wheel mako pyyaml meson ninja
          rustup toolchain install 1.98.0 --profile minimal
          rustup target add --toolchain 1.98.0 aarch64-apple-ios
          rustup target add aarch64-apple-ios || true
          rustup show
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Add the iOS 16 target to build-turnip-darwin.py
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('unixnu/scripts/build-turnip-darwin.py')
          t = p.read_text()
          if "'ios16'" not in t:
              t = t.replace("choices=('host', 'ios', 'ios27', 'macos27')",
                            "choices=('host', 'ios', 'ios16', 'ios27', 'macos27')")
              t = t.replace("'ios': 'build/mesa-tu-ios',",
                            "'ios': 'build/mesa-tu-ios', 'ios16': 'build/mesa-tu-ios16',")
              t = t.replace("if args.target in ('ios', 'ios27', 'macos27'):",
                            "if args.target in ('ios', 'ios16', 'ios27', 'macos27'):")
              t = t.replace("triple = {'ios': 'arm64-apple-ios17.0',",
                            "triple = {'ios': 'arm64-apple-ios17.0', 'ios16': 'arm64-apple-ios16.0',")
              p.write_text(t)
          print('ios16 target present')
          PY

      - name: Build Turnip for iOS 16
        run: |
          set -euxo pipefail
          python3 unixnu/scripts/build-turnip-darwin.py --target ios16
          ls -l unixnu/build/mesa-tu-ios16/src/freedreno/vulkan/libvulkan_freedreno.dylib

      - name: Build the GPU user lands
        run: |
          set -euxo pipefail
          bash device/scripts/build-nx769j-metal.sh "$PWD/unixnu"
          ls -lR device/.cache/gpu-user/out | head -80

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo '### Diagnostics' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          (cd unixnu && git log --oneline -1) 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          (cd unixnu/.cache/mesa-work && git rev-parse HEAD) 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          (cd device/.cache/gpu-user/metal2vulkan && git rev-parse HEAD) 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the user lands
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nx769j-gpu-user
          path: device/.cache/gpu-user/out
          if-no-files-found: never
